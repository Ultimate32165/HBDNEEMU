<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Playlist | For My Neemu ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1f0b14 0%, #381223 50%, #1a0812 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff0f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      box-sizing: border-box;
    }
    .container {
      max-width: 520px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 182, 193, 0.25);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3.2rem;
      margin-bottom: 0.5rem;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 107, 139, 0.6);
    }
    p {
      color: #f3c5d3;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .back-btn {
      display: inline-block;
      margin-top: 1.5rem;
      color: #fff;
      text-decoration: none;
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      background: rgba(255, 107, 139, 0.25);
      border: 1px solid rgba(255, 107, 139, 0.5);
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }
    .back-btn:hover {
      background: rgba(255, 107, 139, 0.5);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Our Songs</h1>
    <p>Every song here reminds me of you and us ❤️</p>
    
    <iframe
      data-testid="embed-iframe"
      style="border-radius:16px"
      src="https://open.spotify.com/embed/playlist/3Pkbg4b9c4luddBr9lemEq?utm_source=generator&si=ae339e2a2268489c&theme=0"
      width="100%"
      height="352"
      frameBorder="0"
      allowfullscreen=""
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>

    <br>
    <a href="index.html" class="back-btn">← Back to Home</a>
  </div>
</body>
</html>
