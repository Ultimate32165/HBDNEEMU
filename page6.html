<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Letter For You | For My Neemu ❤️</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1f0b14 0%, #381223 50%, #1a0812 100%);
      --accent-pink: #ff6b8b;
      --accent-gold: #ffd166;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 182, 193, 0.25);
      --text-main: #fff0f5;
      --text-sub: #f3c5d3;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2.5rem 1rem 3.5rem;
      overflow-x: hidden;
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 2.2rem;
      z-index: 1;
    }

    .title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3.2rem, 7vw, 4.8rem);
      margin-bottom: 0.3rem;
      text-shadow: 0 0 15px rgba(255, 107, 139, 0.6);
      color: #fff;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 1rem;
      letter-spacing: 1px;
    }

    /* Envelopes Grid */
    .letters-grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem;
      padding: 0 0.5rem;
      margin-bottom: 3.5rem;
      z-index: 1;
    }

    .envelope-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.2rem 1.6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.2rem;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  border-color 0.4s ease,
                  box-shadow 0.4s ease;
    }

    .envelope-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--accent-pink);
      box-shadow: 0 18px 40px rgba(255, 107, 139, 0.3);
    }

    .wax-seal {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff8da7, #b81d48);
      border: 2px solid rgba(255, 209, 102, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 6px 20px rgba(184, 29, 72, 0.5);
      transition: transform 0.3s ease;
    }

    .envelope-card:hover .wax-seal {
      transform: scale(1.1) rotate(6deg);
    }

    .envelope-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: #fff;
      font-weight: 600;
    }

    .envelope-sub {
      font-size: 0.88rem;
      color: var(--text-sub);
      line-height: 1.5;
    }

    .read-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.4rem;
      border-radius: 25px;
      background: linear-gradient(135deg, var(--accent-pink), #ff477e);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(255, 107, 139, 0.4);
    }

    /* Fullscreen Reading Modal */
    .letter-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 4, 10, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .letter-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .parchment {
      background: #fdfbf7;
      color: #2b1720;
      max-width: 580px;
      width: 100%;
      max-height: 82vh;
      border-radius: 20px;
      padding: 2.8rem 2.2rem 2.2rem;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), inset 0 0 40px rgba(224, 203, 175, 0.3);
      border: 1px solid #ebd9c2;
      animation: modalSlideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalSlideUp {
      0% { transform: translateY(30px) scale(0.96); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .parchment::-webkit-scrollbar {
      width: 6px;
    }
    .parchment::-webkit-scrollbar-thumb {
      background: #dfc3aa;
      border-radius: 10px;
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 18px;
      font-size: 1.8rem;
      color: #824d5e;
      background: none;
      border: none;
      cursor: pointer;
      line-height: 1;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .modal-close-btn:hover {
      transform: scale(1.15);
      color: #b81d48;
    }

    .letter-salutation {
      font-family: 'Great Vibes', cursive;
      font-size: 2.4rem;
      color: #b81d48;
      margin-bottom: 1.2rem;
    }

    .letter-body {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      line-height: 1.85;
      color: #3b222c;
      white-space: pre-line;
      margin-bottom: 2rem;
      user-select: text;
    }

    .letter-signature {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      font-weight: 700;
      color: #b81d48;
      text-align: right;
    }

    .bottom-nav {
      display: flex;
      gap: 1rem;
      z-index: 1;
    }

    .back-btn {
      color: #fff;
      text-decoration: none;
      padding: 0.6rem 1.5rem;
      border-radius: 30px;
      background: rgba(255, 107, 139, 0.2);
      border: 1px solid rgba(255, 107, 139, 0.5);
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(255, 107, 139, 0.4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <header class="header">
    <h1 class="title">Letters For You</h1>
    <p class="subtitle">Words written straight from my heart, sealed just for Neemu ✨</p>
  </header>

  <!-- Envelopes Section -->
  <main class="letters-grid" id="lettersContainer"></main>

  <!-- Reading Modal -->
  <div class="letter-modal" id="letterModal" onclick="window.LetterApp.close()">
    <div class="parchment" onclick="event.stopPropagation()">
      <button class="modal-close-btn" onclick="window.LetterApp.close()">✕</button>
      <div class="letter-salutation" id="letterSalutation"></div>
      <div class="letter-body" id="letterBody"></div>
      <div class="letter-signature" id="letterSignature">Forever Yours ❤️</div>
    </div>
  </div>

  <footer class="bottom-nav">
    <a href="index.html" class="back-btn spa-link">← Back to Home</a>
  </footer>

  <script>
    // Explicitly attach the app and click handlers to window
    window.LetterApp = {
      letters: [
        {
          seal: "💌",
          title: "To My Favorite Human",
          preview: "When you first walked into my life, everything turned brighter...",
          salutation: "My Dearest Neemu,",
          body: "Happy Birthday my love!\n\nWords will never be enough to capture just how much you mean to me. Every late night conversation, every laugh, and every quiet moment we've shared has become my favorite part of living.\n\nThank you for being my constant peace and my greatest comfort. I promise to stand by you through every high and low.",
          signature: "Forever & Always ❤️"
        },
        {
          seal: "🌹",
          title: "Why You Are Special",
          preview: "A reminder of all the little things that make you so irreplaceable...",
          salutation: "To My Beautiful Girl,",
          body: "I love the way you smile when you're shy, how you check up on me when I'm tired, and the warm sound of your voice.\n\nYou make the most ordinary days feel magical. Never forget how truly incredible, capable, and cherished you are.",
          signature: "Yours completely, Always 🌹"
        },
        {
          seal: "✨",
          title: "A Promise For Our Future",
          preview: "Wherever this road takes us, my hand will always hold yours...",
          salutation: "My Sweet Neemu,",
          body: "Even when miles or days keep us apart, you are always the first thought in my morning and the last wish before I fall asleep.\n\nI can't wait for all the birthdays we have yet to celebrate side by side. May this year bring you all the warmth, joy, and dreams your heart desires.",
          signature: "With all my love & heart ✨"
        }
      ],

      render: function() {
        var container = document.getElementById('lettersContainer');
        if (!container) return;
        container.innerHTML = '';

        var self = this;
        this.letters.forEach(function(letter, index) {
          var card = document.createElement('div');
          card.className = 'envelope-card';
          // Use direct function listener instead of inline string attributes
          card.onclick = function() {
            self.open(index);
          };

          card.innerHTML = 
            '<div class="wax-seal">' + letter.seal + '</div>' +
            '<h2 class="envelope-title">' + letter.title + '</h2>' +
            '<p class="envelope-sub">' + letter.preview + '</p>' +
            '<span class="read-badge">Open Letter 💌</span>';

          container.appendChild(card);
        });
      },

      open: function(index) {
        var item = this.letters[index];
        if (!item) return;

        document.getElementById('letterSalutation').textContent = item.salutation;
        document.getElementById('letterBody').textContent = item.body;
        document.getElementById('letterSignature').textContent = item.signature;

        var modal = document.getElementById('letterModal');
        if (modal) {
          modal.classList.add('active');
          document.body.style.overflow = 'hidden';
        }
      },

      close: function() {
        var modal = document.getElementById('letterModal');
        if (modal) {
          modal.classList.remove('active');
          document.body.style.overflow = 'auto';
        }
      }
    };

    // Render immediately when loaded
    window.LetterApp.render();
  </script>
</body>
</html>
