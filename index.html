    :root {
      --bg-gradient: linear-gradient(135deg, #1f0b14 0%, #381223 50%, #1a0812 100%);
      --accent-pink: #ff6b8b;
      --accent-gold: #ffd166;
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 182, 193, 0.25);
      --card-hover-border: rgba(255, 107, 139, 0.6);
      --text-main: #fff0f5;
      --text-sub: #f3c5d3;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* Persistent Audio Player Floating Widget */
    .audio-player-widget {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      background: rgba(31, 11, 20, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 107, 139, 0.5);
      border-radius: 40px;
      padding: 8px 16px 8px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 107, 139, 0.3);
      transition: all 0.3s ease;
    }

    .audio-player-widget:hover {
      box-shadow: 0 10px 30px rgba(255, 107, 139, 0.4);
      transform: translateY(-2px);
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent-pink), #ff477e);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      transition: transform 0.2s ease;
    }

    .play-btn:hover {
      transform: scale(1.08);
    }

    .music-info {
      font-size: 0.82rem;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
    }

    .music-title {
      font-weight: 600;
      color: #fff;
    }

    /* Floating Heart Canvas */
    #heart-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    /* Dynamic Page Container */
    #app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 5rem;
      transition: opacity 0.25s ease;
    }

    /* Header Section */
    .header-container {
      text-align: center;
      margin-bottom: 3rem;
    }

    .main-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3.2rem, 8vw, 5.5rem);
      font-weight: 400;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 107, 139, 0.6), 0 0 35px rgba(255, 107, 139, 0.3);
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .sub-title {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-sub);
      opacity: 0.85;
    }

    /* Cards Grid */
    .grid-container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      padding: 0 1rem;
    }

    .card-link {
      text-decoration: none;
      color: inherit;
      display: block;
      border-radius: 20px;
      cursor: pointer;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.4s ease, box-shadow 0.4s ease;
      display: flex;
      flex-direction: column;
    }

    .card-link:hover .card {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--card-hover-border);
      box-shadow: 0 18px 40px rgba(255, 107, 139, 0.25);
    }

  width: 100%;

}

      opacity: 0.7;

  </style>

  <!-- Audio Controls & SPA Seamless Page Navigation Script -->
  <script>
    const audio = document.getElementById('bg-audio');
    const playBtn = document.getElementById('musicToggleBtn');
    const statusText = document.getElementById('music-status');
    const appContainer = document.getElementById('app-container');

    // Music Player logic
    let isPlaying = false;

    function toggleMusic() {
      if (isPlaying) {
        audio.pause();
        playBtn.textContent = '▶';
        statusText.textContent = 'Paused';
        isPlaying = false;
      } else {
        audio.play().then(() => {
          playBtn.textContent = '❚❚';
          statusText.textContent = 'Playing ❤️';
          isPlaying = true;
        }).catch(err => {
          console.log("Autoplay blocked, needs click:", err);
        });
      }
    }

    playBtn.addEventListener('click', toggleMusic);

    // Auto-start music on very first user interaction
    document.addEventListener('click', function startOnFirstClick() {
      if (!isPlaying) {
        audio.play().then(() => {
          playBtn.textContent = '❚❚';
          statusText.textContent = 'Playing ❤️';
          isPlaying = true;
        }).catch(() => {});
      }
      document.removeEventListener('click', startOnFirstClick);
    }, { once: true });

    // SPA Router: Load pages dynamically without reloading browser (Audio Keeps Playing!)
    const originalHomeHTML = appContainer.innerHTML;

    async function loadPage(url) {
      if (url === 'index.html' || url === '' || url === window.location.pathname) {
        appContainer.style.opacity = '0';
        setTimeout(() => {
          appContainer.innerHTML = originalHomeHTML;
          attachNavigationEvents();
          appContainer.style.opacity = '1';
          window.scrollTo(0, 0);
        }, 200);
        return;
      }

      try {
        appContainer.style.opacity = '0';
        const response = await fetch(url);
        const html = await response.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        setTimeout(() => {
          // Replace body content
          appContainer.innerHTML = doc.body.innerHTML;

          // Re-execute scripts from the loaded page so games/decks work
          const scripts = doc.querySelectorAll('script');
          scripts.forEach(oldScript => {
            const newScript = document.createElement('script');
            if (oldScript.src) {
              newScript.src = oldScript.src;
            } else {
              newScript.textContent = oldScript.textContent;
            }
            document.body.appendChild(newScript);
          });

          // Inject any specific styles from that page
          const styles = doc.querySelectorAll('style, link[rel="stylesheet"]');
          styles.forEach(style => document.head.appendChild(style.cloneNode(true)));

          attachNavigationEvents();
          appContainer.style.opacity = '1';
          window.scrollTo(0, 0);
        }, 200);

      } catch (err) {
        console.error("Failed to load page dynamically:", err);
        window.location.href = url; // Fallback to normal navigation
      }
    }

    function attachNavigationEvents() {
      document.querySelectorAll('a').forEach(anchor => {
        const href = anchor.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('#')) {
          anchor.onclick = (e) => {
            e.preventDefault();
            loadPage(href);
          };
        }
      });
    }

    attachNavigationEvents();

    // Floating Hearts Animation on Canvas
    const canvas = document.getElementById('heart-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Heart {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 20;
        this.size = Math.random() * 14 + 8;
        this.speedY = Math.random() * 1.2 + 0.5;
        this.speedX = Math.sin(Math.random() * 2) * 0.4;
        this.opacity = Math.random() * 0.4 + 0.1;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -20) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = '#ff6b8b';
        ctx.beginPath();
        const top = this.size * 0.3;
        ctx.moveTo(this.x, this.y + top);
        ctx.bezierCurveTo(this.x, this.y, this.x - this.size / 2, this.y, this.x - this.size / 2, this.y + top);
        ctx.bezierCurveTo(this.x - this.size / 2, this.y + (this.size + top) / 2, this.x, this.y + (this.size + top) / 2, this.x, this.y + this.size);
        ctx.bezierCurveTo(this.x, this.y + (this.size + top) / 2, this.x + this.size / 2, this.y + (this.size + top) / 2, this.x + this.size / 2, this.y + top);
        ctx.bezierCurveTo(this.x + this.size / 2, this.y, this.x, this.y, this.x, this.y + top);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    let hearts = Array.from({ length: 25 }, () => new Heart());
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hearts.forEach(h => { h.update(); h.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
